# ──────────────────────────────────────────────────────────────
# Quarto site configuration
# ──────────────────────────────────────────────────────────────
project:
  type: website
  output-dir: docs
extensions:
  - quarto-ext/quartodoc

format:
  html:
    css:
      - reference/_styles-quartodoc.css
    mathjax: default

metadata-files:
  - reference/_sidebar.yml

# ──────────────────────────────────────────────────────────────
# Quartodoc configuration
# ──────────────────────────────────────────────────────────────
quartodoc:
  package: skrom
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  # if your sources live in, say, src/, set this so quartodoc can find them
  source_dir: src

  sections:
    - title: "Full-Order Model (FOM)"
      contents:
        - skrom.fom.fem_utils

    - title: "Reduced-Order Model (ROM)"
      contents:
        - skrom.rom.bilinear_form_rom
        - skrom.rom.linear_form_rom
        - skrom.rom.rom_error_est
        - skrom.rom.rom_utils

    - title: "DEIM Hyper-Reduction"
      contents:
        - skrom.rom.deim.bilinear_form_hyperrom_deim
        - skrom.rom.deim.linear_form_hyperrom_deim
        - skrom.rom.deim.deim

    - title: "ECSW Hyper-Reduction"
      contents:
        - skrom.rom.ecsw.bilinear_form_hyperrom_ecsw
        - skrom.rom.ecsw.linear_form_hyperrom_ecsw
        - skrom.rom.ecsw.custom_nnls
        - skrom.rom.ecsw.hyperreduce

    - title: "Utilities"
      contents:
        - skrom.utils.imports
        - skrom.utils.reduced_basis.svd

    - title: "Dynamics"
      contents:
        - skrom.utils.dynamics.integrators
        - skrom.utils.dynamics.newmark_beta

    - title: "Visualization"
      contents:
        - skrom.utils.visualization.generate_vtk
        - skrom.utils.visualization.generate_vtu
        - skrom.utils.visualization.vtuwriter
        - skrom.utils.visualization.color_palette
        - skrom.utils.visualization.plot_utils
        - skrom.utils.visualization.sci_mplstyle_package.setup

    - title: "Templates"
      contents:
        - skrom.templates.problem_template.bilinear_forms
        - skrom.templates.problem_template.linear_forms
        - skrom.templates.problem_template.params
        - skrom.templates.problem_template.domain
        - skrom.templates.problem_template.problem_def
        - skrom.templates.problem_template.properties
