[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skrom"
version = "1.0.0"
description = "Your project's description"
authors = [
  { name = "Ali Syed", email = "saabidi1@tamu.edu" },
  { name = "Suparno Bhattacharyya", email = "suparno.bhattacharyya.official@gmail.com" }
]
dependencies = [
  "numpy",
  "scipy",
  "sympy",
  "scikit-fem[all]",
  "pyamg",
  "pyDOE",
  "ptitprince",
  "matplotlib==3.8.4",
  "scikit-learn"
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

[project.scripts]
skrom = "skrom.cli:cli"  # ← this gives the user `skrom` command

[tool.setuptools.package-data]
# Include templates and notebooks in install
"skrom" = [
  "templates/problem_template/*.py",
  "templates/problem_template/*.ipynb"
]

[tool.setuptools.packages.find]
where = ["src"]          #  ← “only look under src/”
[tool.setuptools.package-dir]
"" = "src"               #  ← “src/ is the package root”

